<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <!-- Dit zijn de instellingen die iOS nodig heeft om de app chrome-loos
         (zonder Safari-balken) te openen vanaf het beginscherm. Ze staan hier
         in de allereerste pagina die geladen wordt, in tegenstelling tot de
         Streamlit-app zelf, waar Streamlit's eigen 'Voeg toe aan beginscherm'
         een bekende bug heeft. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spacetime Forge">
    <meta name="theme-color" content="#0a0a0f">

    <title>Spacetime Forge</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #0a0a0f;
        }
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* height: 100dvh zorgt dat de iframe rekening houdt met de
               dynamische Safari-balken en de notch/home-indicator van de
               iPhone/iPad, zodat er geen wit randje overblijft. */
            height: 100dvh;
            border: none;
            padding-top: env(safe-area-inset-top);
        }
    </style>
</head>
<body>
    <iframe
        src="https://relativity-toolkit.streamlit.app/?embed=true"
        title="Spacetime Forge"
        allow="fullscreen"
    ></iframe>
</body>
</html>
